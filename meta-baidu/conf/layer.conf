# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-baidu"
BBFILE_PATTERN_meta-baidu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-baidu = "6"

LAYERDEPENDS_meta-baidu = "core"
LAYERSERIES_COMPAT_meta-baidu = "honister"
