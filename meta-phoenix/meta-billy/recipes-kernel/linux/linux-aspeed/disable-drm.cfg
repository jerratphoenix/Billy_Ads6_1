# Force-disable problematic DRM & bridge drivers
CONFIG_DRM=n
CONFIG_DRM_KMS_HELPER=n
CONFIG_DRM_BRIDGE=n
CONFIG_DRM_SII902X=n
CONFIG_DRM_PARADE_PS8622=n
CONFIG_DRM_NXP_PTN3460=n
CONFIG_DRM_TI_TFP410=n
CONFIG_DRM_I2C_SIL164=n
CONFIG_DRM_NXP_TDA998X=n

# Disable framebuffer and fbdev fallback
CONFIG_FB=n
CONFIG_FB_ASPEED=n
CONFIG_DRM_FBDEV_EMULATION=n

# Disable sound & wireless completely
CONFIG_SOUND=n
CONFIG_SND=n
CONFIG_SND_SOC=n
CONFIG_MAC80211=n
CONFIG_CFG80211=n

