# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "brightoncity"
BBFILE_PATTERN_brightoncity = ""
BBFILE_PRIORITY_brightoncity = "5"
LAYERSERIES_COMPAT_brightoncity = "hardknott honister"
